publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.2
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1

  # Additional features
  provider: ^6.1.2  # State management
  speech_to_text: ^7.3.0  # Voice input (updated for compatibility)
